# Weekly tech-debt audit -- scripts/check_tech_debt.py.
#
# Saturdays 13:30 UTC. TODO build-up, 5,000+ line files, functions over
# complexity 30, declared packages a major version behind PyPI, tests untouched
# for 180+ days, and 30+ line copy-paste (jscpd via npx). Full git history is
# fetched so the stale-tests check can date every test file.
#
# Email settings and the pull_request trigger: see weekly-advisory-check.yml.
name: Weekly tech-debt audit

on:
  schedule:
    - cron: "30 13 * * 6"
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/weekly-tech-debt-audit.yml"
      - "scripts/audit_common.py"
      - "scripts/check_tech_debt.py"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Same ruff release pre-commit pins, so complexity scores match the gate.
      - name: Install ruff
        run: |
          rev=$(grep -A1 'astral-sh/ruff-pre-commit' .pre-commit-config.yaml | sed -n 's/.*rev: v//p')
          python -m pip install "ruff==${rev}"

      - name: Run tech-debt audit
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ vars.DIGEST_TO_EMAIL }}
          PR_FLAGS: ${{ github.event_name == 'pull_request' && '--no-email --report-only' || '--report-only' }}
        run: python scripts/check_tech_debt.py $PR_FLAGS
