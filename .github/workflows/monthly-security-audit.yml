# Monthly security-posture audit -- scripts/check_security_posture.py.
#
# 1st of the month, 13:30 UTC. Secret sweep of every tracked file, Flask
# debugger / non-loopback binding, ruff S-rules under the NEWEST ruff (newer
# rules catch issues in unchanged code), and '# noqa: S...' suppressions not
# yet in the reviewed register (docs/audit/security-suppressions.json).
#
# Email settings and the pull_request trigger: see weekly-advisory-check.yml.
name: Monthly security audit

on:
  schedule:
    - cron: "30 13 1 * *"
  workflow_dispatch: {}
  pull_request:
    paths:
      - ".github/workflows/monthly-security-audit.yml"
      - "scripts/audit_common.py"
      - "scripts/check_security_posture.py"
      - "scripts/check_repo_secrets.py"
      - "docs/audit/security-suppressions.json"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # Deliberately the LATEST ruff, not the pre-commit pin.
      - name: Install ruff
        run: python -m pip install --upgrade ruff

      - name: Run security audit
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          DIGEST_FROM_EMAIL: ${{ vars.DIGEST_FROM_EMAIL }}
          DIGEST_TO_EMAIL: ${{ vars.DIGEST_TO_EMAIL }}
          PR_FLAGS: ${{ github.event_name == 'pull_request' && '--no-email --report-only' || '--report-only' }}
        run: python scripts/check_security_posture.py $PR_FLAGS
